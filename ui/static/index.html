<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>soteria — live monitor</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#0b0e14; color:#dbe2ef; margin:0; }
  header { position:sticky; top:0; background:#11161f; border-bottom:1px solid #232b3a; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 8px 0 0; }
  header .src { font-size:11px; color:#8b96ab; }
  input, select, button { background:#1a2230; color:#dbe2ef; border:1px solid #2c3a52; border-radius:6px; padding:6px 8px; font:inherit; font-size:12px; }
  button.paused { border-color:#b58900; color:#ffd76a; }
  #stats { margin-left:auto; font-size:11px; color:#8b96ab; }
  main { padding:10px 14px 40px; max-width:1100px; margin:0 auto; }
  .row { border:1px solid #232b3a; border-left-width:4px; border-radius:8px; padding:8px 10px; margin:8px 0; background:#11161f; }
  .row.ALLOW { border-left-color:#2ea043; } .row.DENY { border-left-color:#f85149; }
  .row.ASK { border-left-color:#d29922; } .row.INFO { border-left-color:#4493f8; }
  .meta { font-size:11px; color:#8b96ab; display:flex; gap:10px; flex-wrap:wrap; }
  .sum { font-size:13px; margin-top:4px; white-space:pre-wrap; word-break:break-word; }
  details { margin-top:6px; } summary { cursor:pointer; font-size:11px; color:#8b96ab; }
  pre { font-size:11px; background:#0b0e14; padding:8px; border-radius:6px; overflow:auto; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#2ea043; }
  .dot.off { background:#f85149; }
</style>
</head>
<body>
<header>
  <h1>soteria · live</h1><a href="/launcher.html" style="font-size:12px;color:#7aa2f7">+ launch</a>
  <span class="src" id="src"><span class="dot" id="dot"></span> connecting…</span>
  <select id="level"><option value="">all levels</option><option>ALLOW</option><option>DENY</option><option>ASK</option><option>INFO</option></select>
  <select id="source"><option value="file">file log</option><option value="container">docker container</option></select>
  <input id="cname" placeholder="container name (if docker)" size="22" />
  <input id="q" placeholder="filter text…" size="22" />
  <button id="pause">pause</button>
  <button id="clear">clear</button>
  <span id="stats">0 events</span>
</header>
<main id="log"></main>
<script>
const log = document.getElementById('log'), stats = document.getElementById('stats'),
      src = document.getElementById('src'), dot = document.getElementById('dot'),
      level = document.getElementById('level'), q = document.getElementById('q'),
      pauseBtn = document.getElementById('pause'), clearBtn = document.getElementById('clear'),
      sourceSel = document.getElementById('source'), cname = document.getElementById('cname');
let paused = false, count = 0, es = null;

fetch('/api/status').then(r=>r.json()).then(s=>{
  src.innerHTML = `<span class="dot"></span> ${s.log}${s.exists?'':' (missing — append NDJSON to see live rows)'}`;
}).catch(()=>{ src.textContent = 'status unavailable'; });

fetch('/api/events?limit=200').then(r=>r.json()).then(j=>{ (j.lines||[]).forEach(addLine); });

function connect(){
  if (es) es.close();
  let url = '/api/events/stream?source=' + encodeURIComponent(sourceSel.value);
  if (sourceSel.value === 'container' && cname.value.trim()) url += '&name=' + encodeURIComponent(cname.value.trim());
  es = new EventSource(url);
  es.onopen = ()=> dot.classList.remove('off');
  es.onerror = ()=> dot.classList.add('off');
  es.onmessage = (e)=>{ try { addLine(JSON.parse(e.data).raw); } catch(_){} };
}
function addLine(raw){
  if (paused || !raw) return;
  let o; try { o = JSON.parse(raw); } catch { o = {summary: raw, level:'INFO'}; }
  const lv = (o.level||'INFO').toUpperCase();
  if (level.value && lv !== level.value) return;
  if (q.value && !(raw.toLowerCase().includes(q.value.toLowerCase()))) return;
  const d = document.createElement('div');
  d.className = 'row ' + (['ALLOW','DENY','ASK'].includes(lv)?lv:'INFO');
  d.innerHTML = `<div class="meta"><span>${lv}</span><span>${o.ts||''}</span><span>${o.kind||''}</span><span>${o.tool||o.service||''}</span></div>
    <div class="sum"></div><details><summary>raw</summary><pre></pre></details>`;
  d.querySelector('.sum').textContent = o.summary || raw;
  d.querySelector('pre').textContent = JSON.stringify(o, null, 2);
  log.prepend(d);
  while (log.children.length > 500) log.lastChild.remove();
  stats.textContent = (++count) + ' events';
}
pauseBtn.onclick = ()=>{ paused=!paused; pauseBtn.textContent = paused?'resume':'pause'; pauseBtn.classList.toggle('paused', paused); };
clearBtn.onclick = ()=>{ log.innerHTML=''; };
level.onchange = q.oninput = ()=>{};
sourceSel.onchange = cname.onchange = connect;
connect();
</script>
</body>
</html>
